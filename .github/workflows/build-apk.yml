name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # only to publish the APK to this repo's own 'latest' release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is preset);
      # Gradle fetches any missing platform/build-tools on its own.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeLight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publish APK to the "latest" release (one-tap phone download)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ShakeLight-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ShakeLight-debug.apk --title "Shake Light (latest build)" --notes "Debug build of $GITHUB_SHA. Open on the phone, allow this source, install."
