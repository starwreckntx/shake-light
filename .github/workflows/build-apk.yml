name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME is preset);
      # Gradle fetches any missing platform/build-tools on its own.
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShakeLight-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
